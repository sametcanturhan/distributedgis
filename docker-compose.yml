services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gis_project_db
    environment:
      POSTGRES_DB: gis_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gis_project_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gis_project
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    container_name: gis_project_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  road-importer:
    image: iboates/osm2pgsql:latest
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: gis_project
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./osm-data:/data:ro
      - ./osm2pgsql:/config:ro
    command:
      - -O
      - flex
      - -S
      - /config/roads.lua
      - --create
      - /data/berlin-latest.osm.pbf

volumes:
  postgres_data:
